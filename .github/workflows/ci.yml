name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # La suite complète dans les trois fuseaux, chaque nuit et sur demande (et à chaque push sur main).
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

# Un nouveau commit sur une PR annule le passage en cours ; sur main, chaque passage va au bout.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Une PR qui ne touche que site/ ou docs/ ne lance que ESLint et les tests du site ; les tests contre
  # une pile Supabase locale ne tournent que si la PR touche supabase/, src/core/supabase/,
  # src/features/auth/repository/, scripts/supabase-local/, un *.local.spec.ts, pnpm-lock.yaml ou ce workflow.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      supabase: ${{ steps.diff.outputs.supabase }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          app=true
          supabase=true
          if [ "$EVENT" = pull_request ] &&
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') &&
            [ -n "$files" ]; then
            grep -qvE '^(site|docs)/' <<<"$files" || app=false
            grep -qE '^(supabase/|src/core/supabase/|src/features/auth/repository/|scripts/supabase-local/|\.github/workflows/ci\.yml$|pnpm-lock\.yaml$)|\.local\.spec\.ts$' <<<"$files" || supabase=false
          fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"
          echo "supabase=$supabase" | tee -a "$GITHUB_OUTPUT"

  ci:
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Les langues sont dans la clé : no-missing-keys juge un .vue d'après fr.json, que le cache ignore.
      # no-unused-keys tourne toujours sans cache (`lint:i18n`).
      - name: Cache ESLint
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts', '.oxlintrc.json', 'tools/eslint/**', 'src/core/i18n/locales/**') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts', '.oxlintrc.json', 'tools/eslint/**', 'src/core/i18n/locales/**') }}-

      - name: Lint
        run: pnpm lint:ci

      - name: Tests du site
        if: needs.changes.outputs.app != 'true'
        run: pnpm exec vitest run src/__tests__/site- scripts/__tests__/site-

      # Aussi pour site/ seul : `site/_worker.js` est vérifié par tsconfig.vitest.json.
      - name: Type-check
        run: pnpm type-check

      # Type-check fait juste au-dessus : `build-only` plutôt que `build`, qui le relancerait.
      - name: Build
        if: needs.changes.outputs.app == 'true'
        run: pnpm build-only

      - name: Pas d'outils de dev dans le build (fixtures, SQLite du navigateur)
        if: needs.changes.outputs.app == 'true'
        run: pnpm test:build

  tests:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (${{ matrix.shard }}/3)
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/3

  fuseaux:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: ['Pacific/Kiritimati', 'Pacific/Pago_Pago', 'America/Santiago']
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sur une PR, les dossiers des échéances, plus tout test ailleurs qui touche une date ou une heure.
      - name: Unit tests (${{ matrix.tz }}, ${{ matrix.shard }}/3)
        env:
          TZ: ${{ matrix.tz }}
          SHARD: ${{ matrix.shard }}/3
          FULL: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$FULL" = true ]; then
            pnpm exec vitest run --shard="$SHARD"
            exit
          fi
          dates=$(grep -rlE --include='*.spec.ts' --include='*.spec.mjs' \
            'useFakeTimers|setSystemTime|new Date|Date\.(now|UTC|parse)|date-fns|TZ|Intl\.DateTimeFormat|toLocale(Date|Time)?String|getTimezoneOffset|todayIsoDate|[0-9]{4}-[0-9]{2}-[0-9]{2}' \
            src scripts || true)
          pnpm exec vitest run --shard="$SHARD" \
            src/shared/ src/features/treatments/ src/features/vaccinations/ src/features/home/ src/features/weight/ \
            $dates

  android:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # JDK 21 : `android/app/capacitor.build.gradle` compile en ciblant Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web + cap sync
        run: pnpm cap:sync

      # `capacitor.settings.gradle` est généré et versionné, et ses chemins portent le numéro
      # de version des paquets Capacitor : sans ce contrôle, une montée du groupe Dependabot
      # garde la CI verte et casse `dev:mobile --no-sync` (incident #147).
      - name: Projet natif à jour après cap sync
        run: |
          git diff --exit-code -- android || {
            echo "::error::android/ a changé après 'pnpm cap:sync'. Lance 'pnpm cap:sync' en local et commite le diff (voir docs/technical/commandes-utiles.md §2)."
            exit 1
          }

      - name: Build Android (debug)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Permissions du manifest fusionné
        run: pnpm test:manifest

  edge-functions:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Les `index.ts` tournent sous Deno : ni tsconfig.vitest.json ni ESLint ne les lisent.
      - name: Type-check des Edge Functions
        run: deno check supabase/functions/*/index.ts

  # Politiques d'accès (pgTAP) et tests *.local.spec.ts contre une pile Supabase locale jetable :
  # aucun secret du dépôt, aucun appel au vrai projet.
  supabase-local:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      # Secrets tirés au hasard pour ce passage ; PostHog et RevenueCat désactivés : rien ne part chez eux.
      - name: Réglages locaux de delete-account et inactive-accounts
        run: |
          admin_secret=$(openssl rand -hex 32)
          cron_secret=$(openssl rand -hex 32)
          echo "::add-mask::$admin_secret"
          echo "::add-mask::$cron_secret"
          printf 'ADMIN_DELETE_SECRET=%s\nINACTIVE_ACCOUNTS_CRON_SECRET=%s\nPOSTHOG_ERASURE=disabled\nREVENUECAT_ERASURE=disabled\n' "$admin_secret" "$cron_secret" > supabase/functions/.env
          echo "SUPABASE_LOCAL_ADMIN_SECRET=$admin_secret" >> "$GITHUB_ENV"
          echo "SUPABASE_LOCAL_CRON_SECRET=$cron_secret" >> "$GITHUB_ENV"

      - name: Démarrer la pile Supabase locale
        run: supabase start -x studio,logflare,vector,realtime,imgproxy,mailpit,postgres-meta,supavisor

      - name: Rejouer les migrations sur une base vide
        run: supabase db reset

      - name: Exiger le mot de passe actuel pour en changer (réglage de l'hébergé)
        run: scripts/supabase-local/require-current-password.sh

      - name: Tests pgTAP
        run: supabase test db

      - name: Tests contre la pile locale (*.local.spec.ts)
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=SUPABASE_LOCAL_URL \
            --override-name auth.anon_key=SUPABASE_LOCAL_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_LOCAL_SERVICE_ROLE_KEY)"
          export SUPABASE_LOCAL_URL SUPABASE_LOCAL_ANON_KEY SUPABASE_LOCAL_SERVICE_ROLE_KEY
          if [ -z "$SUPABASE_LOCAL_URL" ] || [ -z "$SUPABASE_LOCAL_ANON_KEY" ] || [ -z "$SUPABASE_LOCAL_SERVICE_ROLE_KEY" ]; then
            echo "::error::Clés de la pile locale introuvables : les tests seraient sautés."
            exit 1
          fi
          pnpm exec vitest run --reporter=verbose .local.spec.ts

      - name: Arrêter la pile
        if: always()
        run: supabase stop --no-backup

  # Seul passage à attendre : vert si chaque job a réussi, ou n'a été sauté que lorsque c'était voulu.
  verdict:
    name: Verdict
    needs: [changes, ci, tests, fuseaux, android, edge-functions, supabase-local]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          APP: ${{ needs.changes.outputs.app }}
          SUPABASE: ${{ needs.changes.outputs.supabase }}
        run: |
          if [ "$EVENT" = schedule ]; then
            expected='changes fuseaux'
          elif [ "$APP" = true ]; then
            expected='changes ci tests fuseaux android edge-functions'
          else
            expected='changes ci'
          fi
          if [ "$EVENT" != schedule ] && [ "$SUPABASE" = true ]; then
            expected="$expected supabase-local"
          fi
          ok=true
          while read -r job result; do
            if [[ " $expected " == *" $job "* ]]; then want=success; else want=skipped; fi
            echo "$job : $result (attendu : $want)"
            [ "$result" = "$want" ] || ok=false
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS")
          # Cette liste double needs exprès : un job retiré de needs ne doit pas sortir du contrôle en silence.
          for job in changes ci tests fuseaux android edge-functions supabase-local; do
            if ! jq -e --arg j "$job" 'has($j)' <<<"$NEEDS" >/dev/null; then
              echo "::error::$job absent de needs : Verdict ne le contrôle plus."
              ok=false
            fi
          done
          $ok
