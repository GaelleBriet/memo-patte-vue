name: supabase-keep-alive

on:
  schedule:
    # Lundi et jeudi — large marge sous le seuil de pause auto (7 jours d'inactivité)
    # du plan Free Supabase (decisions-log.md 21/08).
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Appel RPC plutôt que /auth/v1/settings : seule une requête Postgres compte comme
      # activité (decisions-log.md 14/09). Fonction : supabase/migrations/*_keep_alive.sql.
      - name: Exécuter une requête Postgres pour éviter la pause automatique
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o /dev/null
