name: supabase-keep-alive

on:
  schedule:
    # Supabase attend quelques requêtes par jour : deux pings par semaine n'ont pas suffi.
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Appel RPC plutôt que /auth/v1/settings : seule une requête Postgres compte comme
      # activité (decisions-log.md 14/09). Fonction : supabase/migrations/*_keep_alive.sql.
      - name: Exécuter une requête Postgres pour éviter la pause automatique
        run: |
          url="${{ secrets.SUPABASE_URL }}"
          ref="${url#https://}"
          echo "Projet visé : ${ref%%.*}"
          body=$(curl -sSf -X POST "$url/rest/v1/rpc/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          [ "$body" = "1" ] || { echo "Réponse inattendue : $body"; exit 1; }
