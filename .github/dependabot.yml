version: 2
updates:
  - package-ecosystem: 'npm' # couvre pnpm (lockfile pnpm-lock.yaml détecté automatiquement)
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Les paquets Capacitor doivent monter ensemble : core, cli et android
      # désalignés cassent `cap sync`.
      capacitor:
        patterns:
          - '@capacitor/*'
          - '@capacitor-community/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
